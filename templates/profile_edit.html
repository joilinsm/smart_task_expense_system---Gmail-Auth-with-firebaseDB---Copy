{% extends 'base.html' %}
{% block title %}Edit Profile | Smart Task & Expense{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Edit Profile</h5>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('profile.edit_profile') }}">
                    <div class="mb-3">
                        <label class="form-label">Username *</label>
                        <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
                        <small class="form-text text-muted">Your unique username (alphanumeric and underscores only)</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">First Name</label>
                        <input type="text" name="first_name" class="form-control" value="{{ user.first_name or '' }}" placeholder="First Name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Last Name</label>
                        <input type="text" name="last_name" class="form-control" value="{{ user.last_name or '' }}" placeholder="Last Name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email *</label>
                        <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
                    </div>
                    <div class="row mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Country Code</label>
                            <select name="country_code" class="form-select">
                                <option value="+91" {% if user.country_code == '+91' %}selected{% endif %}>🇮🇳 India (+91)</option>
                                <option value="+1" {% if user.country_code == '+1' %}selected{% endif %}>🇺🇸 USA/Canada (+1)</option>
                                <option value="+44" {% if user.country_code == '+44' %}selected{% endif %}>🇬🇧 UK (+44)</option>
                                <option value="+61" {% if user.country_code == '+61' %}selected{% endif %}>🇦🇺 Australia (+61)</option>
                                <option value="+81" {% if user.country_code == '+81' %}selected{% endif %}>🇯🇵 Japan (+81)</option>
                                <option value="+86" {% if user.country_code == '+86' %}selected{% endif %}>🇨🇳 China (+86)</option>
                                <option value="+33" {% if user.country_code == '+33' %}selected{% endif %}>🇫🇷 France (+33)</option>
                                <option value="+49" {% if user.country_code == '+49' %}selected{% endif %}>🇩🇪 Germany (+49)</option>
                                <option value="+39" {% if user.country_code == '+39' %}selected{% endif %}>🇮🇹 Italy (+39)</option>
                                <option value="+34" {% if user.country_code == '+34' %}selected{% endif %}>🇪🇸 Spain (+34)</option>
                                <option value="+92" {% if user.country_code == '+92' %}selected{% endif %}>🇵🇰 Pakistan (+92)</option>
                                <option value="+880" {% if user.country_code == '+880' %}selected{% endif %}>🇧🇩 Bangladesh (+880)</option>
                            </select>
                        </div>
                        <div class="col-md-8">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" name="phone_number" class="form-control" value="{{ user.phone_number or '' }}" placeholder="9876543210">
                            <small class="form-text text-muted">Enter 10 digits (without country code)</small>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Monthly Budget</label>
                        <div class="input-group">
                            <span class="input-group-text">₹</span>
                            <input type="number" name="monthly_budget" class="form-control" 
                                   value="{{ user.monthly_budget or 0 }}" 
                                   min="0" step="100" 
                                   placeholder="5000"
                                   required>
                        </div>
                        <small class="form-text text-muted">Set your monthly expense budget</small>
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                        <a class="btn btn-outline-secondary" href="{{ url_for('profile.view_profile') }}">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
