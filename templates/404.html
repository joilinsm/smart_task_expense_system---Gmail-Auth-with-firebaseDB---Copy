{% extends 'base.html' %}

{% block title %}Page Not Found - Smart Task & Expense System{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="col-md-6 text-center">
            <div class="mb-4">
                <h1 class="display-1 text-primary fw-bold">404</h1>
                <h2 class="mb-3">Page Not Found</h2>
                <p class="text-muted lead">The page you're looking for doesn't exist or has been moved.</p>
            </div>
            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary btn-lg px-4">
                    ← Back to Dashboard
                </a>
                <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary btn-lg px-4">
                    Go to Login
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
