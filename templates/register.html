{% extends 'base.html' %}

{% block title %}Register - Smart Task & Expense System{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4 text-primary fw-bold">📝 Register</h2>
                    
                    <form method="POST" novalidate>
                        <div class="mb-3">
                            <label for="first_name" class="form-label">First Name (Optional)</label>
                            <input type="text" class="form-control" id="first_name" name="first_name">
                        </div>
                        
                        <div class="mb-3">
                            <label for="last_name" class="form-label">Last Name (Optional)</label>
                            <input type="text" class="form-control" id="last_name" name="last_name">
                        </div>
                        
                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" class="form-control form-control-lg" id="username" name="username" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control form-control-lg" id="password" name="password" required>
                                <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Show password" aria-pressed="false">
                                    <span aria-hidden="true">👁</span>
                                </button>
                            </div>
                            <small class="text-muted">Minimum 6 characters</small>
                        </div>
                        
                        <div class="mb-3">
                            <label for="confirm_password" class="form-label">Confirm Password</label>
                            <div class="input-group">
                                <input type="password" class="form-control form-control-lg" id="confirm_password" name="confirm_password" required>
                                <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword" aria-label="Show confirm password" aria-pressed="false">
                                    <span aria-hidden="true">👁</span>
                                </button>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100">Register</button>
                    </form>
                    
                    <hr class="my-4">
                    
                    <p class="text-center">
                        Already have an account? 
                        <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('DOMContentLoaded', function() {
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm_password');
    const togglePassword = document.getElementById('togglePassword');
    const toggleConfirm = document.getElementById('toggleConfirmPassword');

    if (passwordInput && togglePassword) {
        togglePassword.addEventListener('click', function() {
            const isHidden = passwordInput.getAttribute('type') === 'password';
            passwordInput.setAttribute('type', isHidden ? 'text' : 'password');
            togglePassword.setAttribute('aria-pressed', String(isHidden));
            togglePassword.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
        });
    }

    if (confirmInput && toggleConfirm) {
        toggleConfirm.addEventListener('click', function() {
            const isHidden = confirmInput.getAttribute('type') === 'password';
            confirmInput.setAttribute('type', isHidden ? 'text' : 'password');
            toggleConfirm.setAttribute('aria-pressed', String(isHidden));
            toggleConfirm.setAttribute('aria-label', isHidden ? 'Hide confirm password' : 'Show confirm password');
        });
    }
});
</script>
{% endblock %}
