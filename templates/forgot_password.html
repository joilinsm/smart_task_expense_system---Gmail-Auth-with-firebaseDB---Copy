{% extends 'base.html' %}

{% block title %}Forgot Password - Smart Task & Expense System{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-5">
                    <h2 class="card-title text-center mb-4 text-primary fw-bold">🔑 Forgot Password</h2>
                    <p class="text-center text-muted mb-4">Enter your email address and we'll send you an OTP to reset your password.</p>
                    
                    <form method="POST" novalidate>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <input type="email" class="form-control form-control-lg" id="email" name="email" required>
                        </div>
                        
                        <button type="submit" class="btn btn-primary btn-lg w-100">Send Reset OTP</button>
                    </form>
                    
                    <hr class="my-4">
                    
                    <p class="text-center">
                        Remember your password? 
                        <a href="{{ url_for('auth.login') }}" class="text-decoration-none">Login here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
