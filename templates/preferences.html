{% extends 'base.html' %}
{% block title %}Preferences | Smart Task & Expense{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8 col-xl-6">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white d-flex align-items-center justify-content-between">
                <div>
                    <h5 class="mb-0">Preferences</h5>
                    <small class="text-white-50">Defaults for tasks, budgeting, and notifications</small>
                </div>
            </div>
            <div class="card-body">
                <form method="POST" action="{{ url_for('profile.preferences') }}">
                    <div class="mb-3">
                        <label class="form-label">Monthly Budget Limit (INR)</label>
                        <input type="number" step="0.01" min="0" name="monthly_budget" class="form-control" value="{{ user.monthly_budget or 0 }}" required>
                        <small class="text-muted">Used for budget alerts on expenses</small>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Theme Preference</label>
                        <select name="theme_preference" class="form-select">
                            {% for theme in theme_choices %}
                                <option value="{{ theme }}" {% if user.theme_preference == theme %}selected{% endif %}>{{ theme|capitalize }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-check form-switch mb-4">
                        <input class="form-check-input" type="checkbox" id="notifications" name="notification_enabled" {% if user.notification_enabled %}checked{% endif %}>
                        <label class="form-check-label" for="notifications">Enable notifications and reminders</label>
                    </div>
                    <div class="d-flex gap-2 justify-content-end">
                        <a class="btn btn-outline-secondary" href="{{ url_for('profile.view_profile') }}">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Preferences</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
